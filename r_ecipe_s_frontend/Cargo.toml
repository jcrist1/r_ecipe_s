[package]
name = "r_ecipe_s_frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = "1.0.133"
pulldown-cmark = "0.9"
web-sys = { version = "0.3.77", features = [
        "InputEvent",
        "KeyboardEvent",
        "Location",
        "Storage",
        "HtmlSelectElement",
        "HtmlTextAreaElement",
] }
anyhow = "1.0"
r_ecipe_s_backend = { path = "../r_ecipe_s_backend", default-features = false }
thiserror = "1"
url = { version = "2", features = ["serde"] }
leptos = { version = "0.7.8", features = ["csr"] }
log = "0.4.20"
serde_json = "1.0.107"
gloo-net = "0.6.0"
uuid = { version = "1.5.0", features = ["v4", "js"] }
