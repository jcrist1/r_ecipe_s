[package]
name = "r_ecipe_s_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
sqlx = { version = "0.8.6", features = [
  "migrate",
  "runtime-tokio-rustls",
  "postgres",
  "json",
  "time",
  "macros",
], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
config = { version = "0.15.11", features = ["toml"], optional = true }
clap = { version = "4.1", optional = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3.19", optional = true }
time = { version = "0.3", optional = true }
axum = { version = "0.8.4", optional = true, features = ["macros"] }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
axum-auth = { version = "0.8.1", optional = true }
jsonwebtoken = { version = "9.3.1", optional = true }
axum-extra = { version = "0.10.1", optional = true, features = [
  "cookie",
  "typed-header",
] }
anyhow = { version = "1.0.75", optional = true }
itertools = { version = "0.14.0", optional = true }
minilm = { path = "../minilm", optional = true }
headers = { version = "0.4.0", optional = true }
sha2 = { version = "0.10.9", optional = true }

serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
serde_json = "1.0.140"
base64 = { version = "0.22.1", optional = true }

[features]
backend = [
  "sqlx",
  "tokio",
  "config",
  "clap",
  "futures",
  "futures-util",
  "time",
  "axum",
  "tower-service",
  "tracing",
  "axum-auth",
  "jsonwebtoken",
  "axum-extra",
  "anyhow",
  "itertools",
  "minilm",
  "headers",
  "sha2",
  "base64",
]
default = ["backend"]
axum-extra = ["dep:axum-extra"]
axum = ["dep:axum"]
